<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Africa — A Cartographer's Quiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

:root{
  --ink-deep:#0f2e38;
  --ink-deeper:#0a2129;
  --stone:#d8cbb3;
  --stone-dim:#b9ac93;
  --gold:#c9a227;
  --gold-bright:#e3bd45;
  --forest:#5f9169;
  --rust:#b5533c;
  --paper:#f4efe3;
  --paper-dim:#c9c2b2;
  --line:rgba(244,239,227,0.14);
  --dot-red:#e14b3a;
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  height:100%;
  background:var(--ink-deeper);
  color:var(--paper);
  font-family:'Inter',system-ui,sans-serif;
  overflow:hidden;
}

body{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 30% 0%, rgba(201,162,39,0.08), transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(95,145,105,0.06), transparent 50%),
    var(--ink-deeper);
}

/* ---------- Header ---------- */
header{
  padding:18px clamp(16px,4vw,40px) 10px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  border-bottom:1px solid var(--line);
}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--gold);
  display:block;
  margin-bottom:2px;
}

h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:clamp(22px,3.4vw,30px);
  letter-spacing:-0.01em;
  color:var(--paper);
}

.stats{
  display:flex;
  gap:22px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  color:var(--paper-dim);
}
.stats .stat{ text-align:right; }
.stats .stat .num{
  display:block;
  font-size:20px;
  color:var(--paper);
  font-weight:600;
  line-height:1.1;
}
.stats .stat.streak .num{ color:var(--gold-bright); }

/* ---------- Prompt bar ---------- */
.promptbar{
  padding:16px clamp(16px,4vw,40px) 6px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}

.prompt-card{
  background:linear-gradient(180deg, rgba(244,239,227,0.06), rgba(244,239,227,0.02));
  border:1px solid var(--line);
  border-radius:3px;
  padding:10px 26px;
  text-align:center;
  min-width:280px;
  position:relative;
}
.prompt-card::before{
  content:"FIND ON THE MAP";
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  letter-spacing:0.24em;
  color:var(--stone-dim);
  margin-bottom:4px;
}
.prompt-name{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:clamp(24px,4.2vw,34px);
  color:var(--gold-bright);
  line-height:1.1;
}

button.skip, button.endbtn{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  background:transparent;
  border:1px solid var(--line);
  color:var(--paper-dim);
  padding:9px 16px;
  border-radius:3px;
  cursor:pointer;
  transition:border-color .15s, color .15s;
}
button.skip:hover, button.endbtn:hover{ border-color:var(--gold); color:var(--gold-bright); }
button.skip:focus-visible, button.endbtn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

/* ---------- Map ---------- */
.mapwrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px clamp(8px,3vw,30px) 18px;
  min-height:0;
  position:relative;
}

#mapsvg{
  width:100%;
  height:100%;
  max-width:1000px;
}

.graticule{
  fill:none;
  stroke:rgba(244,239,227,0.06);
  stroke-width:0.6;
}

.country{
  fill:var(--stone);
  stroke:var(--ink-deeper);
  stroke-width:0.7;
  cursor:pointer;
  transition:fill .12s ease;
}
.country:hover{ fill:var(--stone-dim); }
.country.correct{ fill:var(--forest) !important; }
.country.wrong{ fill:var(--rust) !important; }
.country.reveal{
  fill:var(--gold-bright) !important;
  stroke:var(--paper);
  stroke-width:1.4;
}
.country.locked{ pointer-events:none; }

/* city dots */
.city-dot{
  fill:var(--dot-red);
  stroke:#3a0a05;
  stroke-width:0.8;
  opacity:0;
  transition:opacity .25s ease, r .25s ease;
}
.city-dot.show{ opacity:1; }
.city-dot-pulse{
  fill:none;
  stroke:var(--dot-red);
  stroke-width:1.2;
  opacity:0;
}
.city-dot-pulse.show{
  opacity:0.7;
  animation:pulseDot 1.1s ease-out infinite;
}
@keyframes pulseDot{
  0%{ r:4; opacity:0.7; }
  100%{ r:12; opacity:0; }
}

/* feedback stamp */
.stamp{
  position:absolute;
  top:38%; left:50%;
  transform:translate(-50%,-50%) rotate(-11deg) scale(0.6);
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:clamp(26px,4.6vw,42px);
  letter-spacing:0.06em;
  padding:10px 26px;
  border:4px solid currentColor;
  border-radius:6px;
  opacity:0;
  pointer-events:none;
  text-transform:uppercase;
  transition:opacity .12s ease, transform .12s ease;
  mix-blend-mode:screen;
  z-index:5;
}
.stamp.show{
  opacity:0.88;
  transform:translate(-50%,-50%) rotate(-11deg) scale(1);
  transition:opacity .08s ease, transform .28s cubic-bezier(.2,1.4,.4,1);
}
.stamp.correct{ color:var(--forest); }
.stamp.wrong{ color:var(--rust); }

/* city popup card — corner-anchored, positioned by JS to avoid the target country */
.city-popup{
  position:absolute;
  background:var(--ink-deep);
  border:1px solid var(--gold);
  border-radius:4px;
  padding:12px 20px;
  max-width:260px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  z-index:6;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
.city-popup.pos-tl{ top:14px; left:14px; }
.city-popup.pos-tr{ top:14px; right:14px; }
.city-popup.pos-bl{ bottom:14px; left:14px; }
.city-popup.pos-br{ bottom:14px; right:14px; }
.city-popup.pos-tl, .city-popup.pos-tr{ transform:translateY(-10px); }
.city-popup.pos-bl, .city-popup.pos-br{ transform:translateY(10px); }
.city-popup.show{
  opacity:1;
  transform:translateY(0);
}
.city-popup .cp-title{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:6px;
}
.city-popup .cp-cities{
  font-family:'Fraunces',serif;
  font-size:15px;
  color:var(--paper);
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
}
.city-popup .cp-cities span::before{
  content:"● ";
  color:var(--dot-red);
  font-size:10px;
}
.city-popup .cp-cities span:not(:last-child)::after{
  content:"";
}

/* ---------- Footer ---------- */
footer{
  padding:10px clamp(16px,4vw,40px) 16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ---------- End screen ---------- */
.overlay{
  position:fixed; inset:0;
  background:rgba(10,33,41,0.94);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:24px;
}
.overlay.show{ display:flex; }
.report{
  background:var(--ink-deep);
  border:1px solid var(--line);
  border-radius:6px;
  max-width:520px;
  width:100%;
  padding:32px clamp(20px,5vw,40px);
  max-height:86vh;
  overflow-y:auto;
}
.report .eyebrow{ margin-bottom:8px; }
.report h2{
  font-family:'Fraunces',serif;
  font-size:clamp(26px,4vw,34px);
  font-weight:700;
  margin-bottom:4px;
}
.report .scoreline{
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;
  color:var(--paper-dim);
  margin-bottom:20px;
}
.report .scoreline strong{ color:var(--gold-bright); font-size:16px; }
.missed-title{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--rust);
  margin-bottom:10px;
  border-top:1px solid var(--line);
  padding-top:16px;
}
.missed-list{
  list-style:none;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px 16px;
  margin-bottom:24px;
  font-size:14px;
  color:var(--stone);
}
.missed-list li{ display:flex; justify-content:space-between; gap:8px; }
.missed-list .them{ color:var(--paper-dim); font-family:'IBM Plex Mono',monospace; font-size:12px; }
.none-missed{
  color:var(--forest);
  font-size:14px;
  margin-bottom:24px;
}
.restart{
  width:100%;
  background:var(--gold);
  color:var(--ink-deeper);
  border:none;
  border-radius:3px;
  padding:14px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  font-weight:600;
  cursor:pointer;
  transition:background .15s;
}
.restart:hover{ background:var(--gold-bright); }

@media (max-width:520px){
  .stats{ gap:14px; }
  .missed-list{ grid-template-columns:1fr; }
}
</style>
</head>
<body>

<header>
  <div>
    <span class="eyebrow">Field Exercise No. 1</span>
    <h1>Tap Africa</h1>
  </div>
  <div class="stats">
    <div class="stat"><span class="num" id="statScore">0/0</span>Score</div>
    <div class="stat streak"><span class="num" id="statStreak">0</span>Streak</div>
  </div>
</header>

<div class="promptbar">
  <div class="prompt-card">
    <div class="prompt-name" id="promptName">Loading…</div>
  </div>
  <button class="skip" id="skipBtn">Reveal &amp; skip</button>
</div>

<div class="mapwrap">
  <svg id="mapsvg" viewBox="0 0 960 760" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="stamp" id="stamp"></div>
  <div class="city-popup" id="cityPopup">
    <div class="cp-title" id="cpTitle">Major cities</div>
    <div class="cp-cities" id="cpCities"></div>
  </div>
</div>

<footer>
  <button class="endbtn" id="endBtn">End session &amp; view report</button>
</footer>

<div class="overlay" id="overlay">
  <div class="report">
    <span class="eyebrow">Expedition Report</span>
    <h2>Field Report</h2>
    <div class="scoreline">Final score <strong id="finalScore">0/0</strong> — <span id="finalPct">0%</span> accuracy</div>
    <div id="missedSection"></div>
    <button class="restart" id="restartBtn">Chart a new course</button>
  </div>
</div>

292]],"SSD":[["Juba",4.85,31.58333],["Wau",7.7,28.0],["Malakal",9.53472,31.66056]],"SDN":[["Khartoum",15.55177,32.53241],["Omdurman",15.64453,32.47773],["Port Sudan",19.61745,37.21644]],"TZA":[["Dar es Salaam",-6.82349,39.26951],["Dodoma",-6.17221,35.73947],["Mwanza",-2.51667,32.9]],"TGO":[["Lom\u00e9",6.12874,1.22154],["Sokod\u00e9",8.98333,1.13333],["Kara",9.55111,1.18611]],"TUN":[["Tunis",36.81897,10.16579],["Sfax",34.74056,10.76028],["Sousse",35.82539,10.63699]],"UGA":[["Kampala",0.31628,32.58219],["Gulu",2.7746,32.2989],["Mbarara",-0.60467,30.64851]],"ZMB":[["Lusaka",-15.40669,28.28713],["Kitwe",-12.80243,28.21323],["Ndola",-12.95867,28.63659]],"ZWE":[["Harare",-17.82772,31.05337],["Bulawayo",-20.15,28.58333],["Chitungwiza",-18.01274,31.07555]],"ESH":[["Laayoune",27.15366,-13.20329],["Dakhla",23.71667,-15.93611]]};

const width = 960, height = 760;
const svg = d3.select('#mapsvg');
const gGrat = svg.append('g');
const gMap = svg.append('g');
const gDots = svg.append('g');

const projection = d3.geoMercator().fitExtent([[20,20],[width-20,height-20]], africaData);
const path = d3.geoPath(projection);

// graticule for atlas texture
const graticule = d3.geoGraticule().step([10,10]);
gGrat.append('path')
  .datum(graticule)
  .attr('class','graticule')
  .attr('d', path);

// build country paths
const countries = africaData.features.map(f => ({
  id: f.id,
  name: f.properties.name,
  feature: f
}));

const pathSel = gMap.selectAll('path.country')
  .data(countries)
  .enter()
  .append('path')
  .attr('class','country')
  .attr('data-id', d => d.id)
  .attr('d', d => path(d.feature));

// ---------- Quiz state ----------
let current = null;
let score = 0;
let attempted = 0;
let streak = 0;
let missedSet = new Map(); // id -> name, unique missed countries
let locked = false;

function pickRandomCountry(excludeId){
  let choice;
  do {
    choice = countries[Math.floor(Math.random() * countries.length)];
  } while (countries.length > 1 && choice.id === excludeId);
  return choice;
}

function startGame(){
  current = null;
  score = 0; attempted = 0; streak = 0; missedSet = new Map();
  locked = false;
  pathSel.classed('correct', false).classed('wrong', false).classed('reveal', false).classed('locked', false);
  document.getElementById('overlay').classList.remove('show');
  updateStats();
  nextQuestion();
}

function updateStats(){
  document.getElementById('statScore').textContent = `${score}/${attempted}`;
  document.getElementById('statStreak').textContent = streak;
}

function nextQuestion(){
  const prevId = current ? current.id : null;
  current = pickRandomCountry(prevId);
  document.getElementById('promptName').textContent = current.name;
  updateStats();
  locked = false;
}

function showStamp(kind){
  const el = document.getElementById('stamp');
  el.textContent = kind === 'correct' ? 'Correct' : 'Missed';
  el.className = `stamp show ${kind}`;
  setTimeout(()=>{ el.classList.remove('show'); }, 1400);
}

function pickPopupCorner(feature){
  // place the popup in the quadrant OPPOSITE the country's centroid,
  // so it doesn't sit on top of the shape being highlighted
  const c = path.centroid(feature);
  const vert = c[1] < height/2 ? 'b' : 't'; // country in top half -> popup at bottom
  const horiz = c[0] < width/2 ? 'r' : 'l'; // country in left half -> popup at right
  return `pos-${vert}${horiz}`;
}

function showCityPopup(countryId, countryName){
  const cities = cityData[countryId];
  const popup = document.getElementById('cityPopup');
  if(!cities || cities.length === 0){
    popup.classList.remove('show');
    return;
  }
  document.getElementById('cpTitle').textContent = `${countryName} — biggest cities`;
  document.getElementById('cpCities').innerHTML = cities.map(c => `<span>${c[0]}</span>`).join('');
  popup.classList.remove('pos-tl','pos-tr','pos-bl','pos-br');
  popup.classList.add(pickPopupCorner(current.feature));
  popup.classList.add('show');

  // plot red dots
  const dotData = cities.map(c => ({name:c[0], coords: projection([c[2], c[1]])}))
                         .filter(d => d.coords);

  const pulses = gDots.selectAll('circle.city-dot-pulse').data(dotData, d => d.name);
  pulses.exit().remove();
  pulses.enter()
    .append('circle')
    .attr('class','city-dot-pulse')
    .merge(pulses)
    .attr('cx', d => d.coords[0])
    .attr('cy', d => d.coords[1])
    .attr('r', 4)
    .classed('show', true);

  const dots = gDots.selectAll('circle.city-dot').data(dotData, d => d.name);
  dots.exit().remove();
  dots.enter()
    .append('circle')
    .attr('class','city-dot')
    .merge(dots)
    .attr('cx', d => d.coords[0])
    .attr('cy', d => d.coords[1])
    .attr('r', 4)
    .classed('show', true);
}

function hideCityPopup(){
  document.getElementById('cityPopup').classList.remove('show');
  gDots.selectAll('circle').classed('show', false);
  setTimeout(()=>{ gDots.selectAll('circle').remove(); }, 250);
}

function handleClick(event, d){
  if(locked || !current) return;
  locked = true;
  attempted++;

  const clickedPath = pathSel.filter(x => x.id === d.id);
  const correctPath = pathSel.filter(x => x.id === current.id);

  if(d.id === current.id){
    score++; streak++;
    clickedPath.classed('correct', true);
    showStamp('correct');
    showCityPopup(current.id, current.name);
    updateStats();
    setTimeout(()=>{
      clickedPath.classed('correct', false);
      hideCityPopup();
      nextQuestion();
    }, 3200);
  } else {
    streak = 0;
    missedSet.set(current.id, current.name);
    clickedPath.classed('wrong', true);
    correctPath.classed('reveal', true);
    showStamp('wrong');
    showCityPopup(current.id, current.name);
    updateStats();
    setTimeout(()=>{
      clickedPath.classed('wrong', false);
      correctPath.classed('reveal', false);
      hideCityPopup();
      nextQuestion();
    }, 3800);
  }
}

pathSel.on('click', handleClick);

document.getElementById('skipBtn').addEventListener('click', () => {
  if(locked || !current) return;
  locked = true;
  attempted++;
  streak = 0;
  missedSet.set(current.id, current.name);
  const correctPath = pathSel.filter(x => x.id === current.id);
  correctPath.classed('reveal', true);
  showStamp('wrong');
  showCityPopup(current.id, current.name);
  updateStats();
  setTimeout(()=>{
    correctPath.classed('reveal', false);
    hideCityPopup();
    nextQuestion();
  }, 3600);
});

document.getElementById('endBtn').addEventListener('click', finishGame);

function finishGame(){
  document.getElementById('finalScore').textContent = `${score}/${attempted}`;
  const pct = attempted > 0 ? Math.round((score/attempted)*100) : 0;
  document.getElementById('finalPct').textContent = `${pct}%`;

  const section = document.getElementById('missedSection');
  if(missedSet.size === 0){
    section.innerHTML = `<div class="none-missed">${attempted === 0 ? 'No countries attempted yet.' : 'No misses this session. Clean sweep.'}</div>`;
  } else {
    const items = Array.from(missedSet.entries())
      .map(([id, name]) => `<li><span>${name}</span><span class="them">${id}</span></li>`).join('');
    section.innerHTML = `
      <div class="missed-title">Missed (${missedSet.size} unique)</div>
      <ul class="missed-list">${items}</ul>
    `;
  }
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('restartBtn').addEventListener('click', startGame);

startGame();
</script>
